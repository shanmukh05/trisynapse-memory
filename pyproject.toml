[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trisynapse-memory"
version = "0.1.3"
description = "Append-only, citation-first memory for AI agents using Trace & Recall."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ai", "agents", "memory", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "google-genai>=1.0",
  "lancedb>=0.20",
  "numpy>=1.26",
  "pydantic>=2.6",
  "sentence-transformers>=3.0",
  "typer>=0.16",
  "rich>=13.9",
  "textual>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.9,<0.15",
  "httpx>=0.27",
]
server = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
]
files = [
  "pypdf>=5.0",
]
sources = [
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
  "tree-sitter-language-pack>=0.9",
]
tokens = [
  "tiktoken>=0.9",
]
all = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
  "tree-sitter-language-pack>=0.9",
  "tiktoken>=0.9",
]

[project.urls]
Homepage = "https://github.com/shanmukh05/trisynapse-memory"
Repository = "https://github.com/shanmukh05/trisynapse-memory"
Documentation = "https://github.com/shanmukh05/trisynapse-memory/tree/main/docs"
Issues = "https://github.com/shanmukh05/trisynapse-memory/issues"

[project.scripts]
trisynapse-memory = "trisynapse_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trisynapse_memory = ["studio/dist/*.html", "studio/dist/assets/*", "prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
