suite: beam100k
data_root: data/beam100k
dataset: data/100K-00000-of-00001.parquet

models:
  completion:
    provider: openai
    model: gpt-4.1-mini-2025-04-14
  embedding:
    provider: sentence-transformers
    model: all-MiniLM-L6-v2

sampling: sequential

profiles:
  ingest:
    stage: ingest
    mode: end-to-end
  retrieval:
    stage: query
    mode: retrieval
    max_questions: 25
  end-to-end:
    stage: query
    mode: end-to-end
    max_questions: 25
    judge:
      provider: openai
      model: gpt-4o-mini-2024-07-18
