suite: beam10m
data_root: data/beam10m

models:
  completion:
    provider: gemini
    model: gemini-3.7-flash
  embedding:
    provider: sentence-transformers
    model: all-MiniLM-L6-v2

sampling: sequential

profiles:
  ingest:
    stage: ingest
    mode: end-to-end
  retrieval:
    stage: query
    mode: retrieval
    max_questions: 25
  end-to-end:
    stage: query
    mode: end-to-end
    max_questions: 25
    judge:
      provider: gemini
      model: gemini-3.7-flash
