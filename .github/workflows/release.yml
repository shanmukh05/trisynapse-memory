name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - uses: astral-sh/setup-uv@v6
      - run: uv run python scripts/version.py check --tag "${{ github.ref_name }}"
      - run: uv sync --extra dev --extra all
      - run: uv run pytest
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trisynapse/memory check
      - run: pnpm --filter @trisynapse/studio check
      - run: pnpm --filter @trisynapse/studio test
      - run: pnpm --filter @trisynapse/studio build

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: uv run python scripts/version.py check --tag "${{ github.ref_name }}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trisynapse/studio build
      - run: uv build
      - run: uv publish --trusted-publishing always
      - name: Prepare release assets
        run: |
          cp install.sh install.ps1 dist/
          cd dist
          printf '{"version":"%s","package":"trisynapse-memory","extras":"all"}\n' "${GITHUB_REF_NAME#v}" > release.json
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/install.sh
            dist/install.ps1
            dist/release.json
            dist/SHA256SUMS

  installer-smoke:
    needs: publish
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os != 'Windows'
        run: sh install.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1
      - run: trisynapse-memory --version
      - run: trisynapse-memory --json check
