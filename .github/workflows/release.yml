name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - uses: astral-sh/setup-uv@v6
      - run: uv run python scripts/version.py check --tag "${{ github.ref_name }}"
      - run: uv sync --extra dev --extra all
      - run: uv run pytest
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trisynapse/memory check
      - run: pnpm --filter @trisynapse/studio check
      - run: pnpm --filter @trisynapse/studio test
      - run: pnpm --filter @trisynapse/studio build

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: uv run python scripts/version.py check --tag "${{ github.ref_name }}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trisynapse/studio build
      - name: Reuse an existing immutable PyPI release when rerunning a tag
        id: pypi_release
        shell: bash
        run: |
          version="$(python scripts/version.py current)"
          if python scripts/download_pypi_release.py "$version" dist; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 3 ]; then
              exit "$status"
            fi
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pypi_release.outputs.reused != 'true'
        run: uv build
      - if: steps.pypi_release.outputs.reused != 'true'
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple
      - name: Prepare release assets
        run: |
          cp install.sh install.ps1 dist/
          cd dist
          printf '{"version":"%s","package":"trisynapse-memory","extras":"all"}\n' "${GITHUB_REF_NAME#v}" > release.json
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*

  installer-smoke:
    needs: publish
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os != 'Windows'
        run: sh install.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1
      - run: trisynapse-memory --version
      - run: trisynapse-memory --json check
