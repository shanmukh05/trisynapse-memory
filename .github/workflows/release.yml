name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      source_run:
        description: Completed tagged run whose npm step failed after Python publication
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "${{ matrix.python }}" }
      - uses: astral-sh/setup-uv@v6
      - run: python scripts/version.py check
      - if: github.ref_type == 'tag'
        run: python scripts/version.py check --tag "${{ github.ref_name }}"
      - run: uv sync --locked --python "${{ matrix.python }}" --extra dev --extra all
      - run: uv run --no-sync --python "${{ matrix.python }}" ruff check src tests scripts
      - run: uv run --no-sync --python "${{ matrix.python }}" pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v6
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trisynapse/studio build
      - run: pnpm --filter @trisynapse/trisynapse-memory build
      - run: uv lock --check
      - run: uv build --out-dir release-artifacts
      - run: npm pack ./packages/js-sdk --pack-destination release-artifacts
      - uses: actions/upload-artifact@v6
        with:
          name: release-packages
          path: release-artifacts/
          if-no-files-found: error

  package-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - uses: actions/download-artifact@v7
        with:
          name: release-packages
          path: release-artifacts
      - run: uv sync --locked --extra all --no-install-project
      - name: Install and exercise the packed artifacts
        shell: bash
        run: |
          uv pip install --no-deps release-artifacts/*.whl
          sdk_dir="$RUNNER_TEMP/trisynapse-sdk"
          npm install --prefix "$sdk_dir" --ignore-scripts --no-audit --no-fund "$PWD"/release-artifacts/*.tgz
          version="$(uv run --no-sync python scripts/version.py current)"
          uv run --no-sync python scripts/smoke_release.py "$version" "$sdk_dir"

  publish-pypi:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [package-smoke, container-smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v7
        with:
          name: release-packages
          path: release-artifacts
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ release-artifacts/*.whl release-artifacts/*.tar.gz

  publish-npm:
    needs: [package-smoke, container-smoke]
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch' ||
      (github.ref_type == 'tag' && needs.package-smoke.result == 'success' &&
      needs.container-smoke.result == 'success')) }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - name: Resolve the verified release artifacts
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          tag="$GITHUB_REF_NAME"
          run_id="$GITHUB_RUN_ID"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
            run_id="$SOURCE_RUN"
            run="$(gh run view --repo "$GITHUB_REPOSITORY" "$run_id" \
              --json workflowName,event,headBranch,headSha,status,jobs)"
            jq -e '
              .workflowName == "release" and .event == "push" and .status == "completed"
              and any(.jobs[]; .name == "publish-npm" and .conclusion == "failure")
              and ([.jobs[] | select(
                .name == "build" or .name == "container-smoke" or .name == "publish-pypi"
                or (.name | test("^(package-smoke|installer-smoke) \\("))
              )] | length == 9 and all(.[]; .conclusion == "success"))
            ' <<< "$run" >/dev/null
            tag="$(jq -r '.headBranch' <<< "$run")"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]
            ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")"
            tag_sha="$(jq -r '.object.sha' <<< "$ref")"
            if [[ "$(jq -r '.object.type' <<< "$ref")" == tag ]]; then
              tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')"
            fi
            [[ "$tag_sha" == "$(jq -r '.headSha' <<< "$run")" ]]
          fi
          printf 'tag=%s\nrun_id=%s\n' "$tag" "$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.source.outputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: release-packages
          path: release-artifacts
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publish the verified SDK tarball
        shell: bash
        run: |
          version="$(node -p "require('./packages/js-sdk/package.json').version")"
          artifacts=("$PWD"/release-artifacts/*.tgz)
          [[ "${#artifacts[@]}" == 1 && -f "${artifacts[0]}" ]]
          if [[ "$version" == *-* ]]; then
            npm publish "${artifacts[0]}" --access public --tag next
          else
            npm publish "${artifacts[0]}" --access public
          fi

  container-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Build and start the source image
        shell: bash
        run: |
          docker build -t trisynapse-release-smoke .
          container="$(docker run -d -p 127.0.0.1:18765:8765 trisynapse-release-smoke)"
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          curl -fsS --retry 25 --retry-delay 1 --retry-all-errors --max-time 3 \
            http://127.0.0.1:18765/api/v1/health > "$RUNNER_TEMP/trisynapse-health.json"
          python -c 'import json,sys; assert json.load(open(sys.argv[1]))["status"] == "ready"' "$RUNNER_TEMP/trisynapse-health.json"
          curl -fsS http://127.0.0.1:18765/studio/ > "$RUNNER_TEMP/trisynapse-studio.html"
          grep -q '/studio-assets/assets/' "$RUNNER_TEMP/trisynapse-studio.html"
          test "$(docker exec "$container" trisynapse-memory --version)" = "$(python scripts/version.py current)"

  npm-smoke:
    needs: publish-npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.publish-npm.outputs.tag }}
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - name: Install the published SDK
        shell: bash
        run: |
          version="$(node -p "require('./packages/js-sdk/package.json').version")"
          package="@trisynapse/trisynapse-memory@${version}"
          for attempt in {1..10}; do
            if npm view "$package" version >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "npm package did not become available: $package" >&2
              exit 1
            fi
            sleep 6
          done
          mkdir -p "$RUNNER_TEMP/trisynapse-npm-smoke"
          cd "$RUNNER_TEMP/trisynapse-npm-smoke"
          npm install --ignore-scripts --no-audit --no-fund "$package"
          node --input-type=module -e 'import { TrisynapseMemory } from "@trisynapse/trisynapse-memory"; if (typeof TrisynapseMemory !== "function") process.exit(1)'

  installer-smoke:
    needs: publish-pypi
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - if: runner.os != 'Windows'
        run: sh install.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1

  github-release:
    needs: [publish-npm, npm-smoke, installer-smoke]
    if: >-
      ${{ !cancelled() && needs.npm-smoke.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.installer-smoke.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.publish-npm.outputs.tag }}
      - uses: actions/download-artifact@v7
        with:
          name: release-packages
          path: release-artifacts
          run-id: ${{ needs.publish-npm.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Prepare release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.publish-npm.outputs.tag }}
        run: |
          cp install.sh install.ps1 release-artifacts/
          cd release-artifacts
          printf '{"version":"%s","package":"trisynapse-memory","extras":"all"}\n' "${RELEASE_TAG#v}" > release.json
          sha256sum *.whl *.tar.gz *.tgz install.sh install.ps1 release.json > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ needs.publish-npm.outputs.tag }}.md
          tag_name: ${{ needs.publish-npm.outputs.tag }}
          prerelease: ${{ contains(needs.publish-npm.outputs.tag, 'rc') || contains(needs.publish-npm.outputs.tag, 'a') || contains(needs.publish-npm.outputs.tag, 'b') }}
          files: |
            release-artifacts/*.whl
            release-artifacts/*.tar.gz
            release-artifacts/*.tgz
            release-artifacts/install.sh
            release-artifacts/install.ps1
            release-artifacts/release.json
            release-artifacts/SHA256SUMS
