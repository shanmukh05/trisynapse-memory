# uv run python -m trisynapse_memory.benchmarks data/personamem/bench.yaml --profile ingest
suite: personamem
data_root: .
dataset: benchmark/text/benchmark.csv

models:
  completion:
    provider: openai
    model: gpt-5.6-luna
  embedding:
    provider: sentence-transformers
    model: all-MiniLM-L6-v2

sampling: sequential

profiles:
  ingest:
    stage: ingest
    mode: end-to-end
  retrieval:
    stage: query
    mode: retrieval
    # max_questions: 25
  end-to-end:
    stage: query
    mode: end-to-end
    # max_questions: 25
    judge:
      # provider: openai
      # model: gpt-5.6-luna
      provider: gemini
      model: gemini-3.7-flash
