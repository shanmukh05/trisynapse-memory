# uv run python -m trisynapse_memory.benchmarks data/halumem/bench.yaml --profile ingest #--rebuild-store
suite: halumem
data_root: .

models:
  completion:
    provider: openrouter
    model: microsoft/phi-4 
  embedding:
    provider: sentence-transformers
    model: all-MiniLM-L6-v2

sampling: sequential

profiles:
  ingest:
    stage: ingest
    mode: end-to-end
  retrieval:
    stage: query
    mode: retrieval
    # max_questions: 25
  end-to-end:
    stage: query
    mode: end-to-end
    # max_questions: 25
    judge:
      # provider: openrouter
      # model: microsoft/phi-4 
      provider: gemini
      model: gemini-3.7-flash
